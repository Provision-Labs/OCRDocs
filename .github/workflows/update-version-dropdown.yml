name: Update version dropdown in issue templates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch latest release tags
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' | head -n 5)
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update issue templates
        env:
          TAGS: ${{ steps.releases.outputs.tags }}
        run: python3 .github/scripts/update_version_dropdown.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/bug_report_en.yml .github/ISSUE_TEMPLATE/bug_report_ru.yml
          git diff --cached --quiet || git commit -m "chore: update version dropdown from releases"
          git push
